# Politique de cache par extension.
#
# Passer par une `map` plutôt que par un `location ~* \.(css|js|…)$` est ici
# nécessaire, pas cosmétique : en nginx, les locations en expression régulière
# sont évaluées AVANT les locations par préfixe. Une regex de cache prendrait
# donc la main sur `/book/` et court-circuiterait son `alias`, ce qui renvoie
# 404 sur tous les assets. La map applique la règle sans créer de location.
map $uri $mockup_cache {
    default                        "no-store";
    "~*\.(css|js|woff2|jpg|png)$"  "public, max-age=604800";
}

server {
    # Port non privilégié : nginx tourne sans root et sans NET_BIND_SERVICE.
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ── Isolation appliquée par le navigateur ───────────────────────────────
    # `connect-src 'none'` interdit fetch/XHR/WebSocket/sendBeacon : même si du
    # JS tentait de joindre /api/lead, Plausible ou le pixel Meta, le navigateur
    # refuserait. `form-action 'none'` interdit toute soumission de formulaire.
    # C'est la garantie la plus forte du dispositif : elle ne dépend pas de la
    # bonne foi du code de la page.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; form-action 'none'; frame-ancestors 'self'; base-uri 'none'; object-src 'none'" always;

    # Une maquette n'a rien à faire dans un index de moteur de recherche : elle
    # dupliquerait la vraie landing et lui ferait concurrence en référencement.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control $mockup_cache always;

    # Aucune écriture possible, jusque dans le serveur lui-même : tout ce qui
    # n'est pas une lecture est refusé sèchement.
    # (`limit_except` n'existe qu'au niveau location ; ce `if` + `return` est
    # l'équivalent au niveau server, et fait partie des usages sûrs de `if`.)
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Le mockup est servi sous /book/ — l'URL cible demandée.
    # `^~` : une fois ce préfixe reconnu, nginx n'évalue plus aucune regex, ce
    # qui protège l'alias de toute location ajoutée plus tard.
    location ^~ /book/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
    }

    # Confort : /book (sans slash) redirige vers /book/.
    location = /book {
        return 301 /book/;
    }

    # La racine sert la même chose, pour tester le conteneur seul.
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /dev/stdout;
    error_log  /dev/stderr warn;
}
